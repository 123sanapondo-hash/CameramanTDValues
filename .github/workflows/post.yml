name: Daily post

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "true = ручной запрос цен из бота"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          USE_PLAYWRIGHT: "1"
          PUBLISH_URL: ${{ github.event.inputs.refresh == 'true' && secrets.PUBLISH_URL || '' }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: python bot.py --now
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
